<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>NOTES PAGE</title>        
        <style>
            body{background-color: #3345a9ea;
                font-family: Arial, Sans-serif;
                margin: 0;
            }

            #header{
                background-color: #fff4b5;
                padding: 20px;
                text-align: center;
            }

            #header h1{
                margin: 0px;
            }

            #search{
                width: 300px;
                padding: 10px;
                border: 3px solid black;
                font-size: 16px;
            }

            #drive{
                background-color: #fff4b5;
                border: 6px solid black;
                margin: 5px;
                padding:15px;
                min-height: 600px;
            }
            #pdfGrid{
                display: grid;

                grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
                gap: 20px;
                margin-top:20px;
            }
            .pdfCard{
                background-color:white;
                border:4px solid black;
                padding: 10px;
                cursor: pointer;
                transition: 0.3s;
            }
            .pdfCard:hover{
                transform: translateY(-5px);
                box-shadow: 6px 6px 0px black;
            }
            .pdfPreview{
                width: 100%;
                height:250px;
                border:2px solid black;
                background-color: #eeeeee;
            }

        </style>
        <script></script>
    </head>
    <body> 

    </body>
</html>
