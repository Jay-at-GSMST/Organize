<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Extraordinary</title>

    <style>
        body {
            background-color: #3345a9ea;
        }

        div {
            margin: 5px;
            border: 6px solid black;
        }

        .notes {
            width: 1463px;
            height: 106px;
            padding: 5px;
        }

        #listContainer {
            height: 220px;
            overflow-y: auto;
            padding: 10px;
            background-color: #fffdec;
            border: 2px inset #ccc;
            margin: 10px;
        }

        /* PROGRESS WHEEL */

        .wheel {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: conic-gradient(#3345a9 100%, #ddd 0%);
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        #percent {
            background: #fff4b5;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
        }

        /* CONTAINERS */

        #container1 {
            width: 300px;
            height: 450px;
            display: inline-block;
            background-color: #fff4b5;
            vertical-align: top;
        }

        #container2 {
            width: 500px;
            height: 450px;
            display: inline-block;
            background-color: #fff4b5;
            vertical-align: top;
        }

        #container3 {
            width: 100%;
            height: 75px;
            display: block;
            background-color: #fff4b5;
            vertical-align: top;
        }

        #container4 {
            width: 100%;
            height: 200px;
            background-color: #fff4b5;
            vertical-align: top;
        }

        #container5 {
            width: 620px;
            height: 450px;
            display: inline-block;
            background-color: #fff4b5;
            vertical-align: top;
        }

        h1 {
            text-align: center;
        }

        h3 {
            text-align: center;
        }

        /* ALL BUTTONS */

        button {
            background-color: #3345a9;
            color: white;
            border: 3px solid black;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #5263c7;
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        /* TODO LIST */

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 18px;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-item input {
            transform: scale(1.2);
            cursor: pointer;
        }

        .delete-btn {
            background-color: #ff6b6b;
            color: white;
            border: 2px solid black;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            padding: 3px 7px;
        }

        .delete-btn:hover {
            background-color: #ff3b3b;
        }

        .input-area {
            border: none;
            margin: 5px 10px;
            display: flex;
            gap: 5px;
        }

        .input-area input[type="text"] {
            flex-grow: 1;
            padding: 7px;
            font-size: 14px;
            border: 2px solid black;
            border-radius: 4px;
        }

        /* PDF SECTION */

        #pdfArea {
            border: none;
            margin: 10px;
        }

        #pdfList {
            height: 80px;
            overflow-y: auto;
            border: 2px solid black;
            padding: 5px;
            background-color: #fffdec;
        }

        .pdf-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid black;
            padding: 5px;
            margin: 3px;
            background-color: #fff4b5;
        }

        .pdf-item button {
            margin-left: 5px;
        }

        /* PDF BUTTON COLORS */

        .pdf-open {
            background-color: #4caf50;
        }

        .pdf-open:hover {
            background-color: #388e3c;
        }

        .pdf-save {
            background-color: #3345a9;
        }

        .pdf-delete {
            background-color: #ff6b6b;
        }

        .pdf-delete:hover {
            background-color: #ff3b3b;
        }

        /* UPLOAD BUTTON */

        .upload-btn {
            display: inline-block;
            background-color: #3345a9;
            color: white;
            border: 3px solid black;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-btn:hover {
            background-color: #5263c7;
            transform: translateY(-2px);
        }

        .upload-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="center" id="container3">
        <h1>TITLE</h1>
    </div>

    <div class="Center" id="container1">
        <h1>Tabs</h1>

        <ul>
            <li><a href="page2.html"><h3>page2</h3></a></li>
            <li><a href="page3.html"><h3>page3</h3></a></li>
            <li><a href="Finances.html"><h3>Finances</h3></a></li>
        </ul>
    </div>

    <div id="container2">

        <h1>To-do list</h1>

        <div style="border: none; margin: 0 10px; display: flex; gap: 5px;">

            <input
                type="file"
                id="fileInput"
                accept=".txt"
                onchange="loadFile(this)"
                style="display:none;"
            >

            <button onclick="document.getElementById('fileInput').click()">
                Load File
            </button>

            <button onclick="saveFile()">
                Save List
            </button>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="newTaskInput"
                placeholder="Type a new assignment here..."
                onkeypress="handleKeyPress(event)"
            >

            <button onclick="addManualTask()">
                Add
            </button>

        </div>

        <div id="listContainer" onchange="updateProgress()">

            <p
                id="emptyMessage"
                style="color: gray; text-align: center; margin-top: 40px;"
            >
                No remaining tasks. You are at 100%!
            </p>

        </div>

    </div>

    <div id="container5">

        <h1>Progress Wheel</h1>

        <div class="wheel" id="progressWheel">

            <div id="percent">
                100%
            </div>

        </div>

    </div>

    <div class="center" id="container4">

        <h1>Notes</h1>

        <textarea
            id="notes"
            class="notes"
            placeholder="Start typing your notes here..."
        ></textarea>

        <div id="pdfArea">

            <input
                type="file"
                id="pdfInput"
                accept=".pdf"
                onchange="uploadPDF(this)"
                style="display: none;"
            >

            <label for="pdfInput" class="upload-btn">
                📄 Upload PDF
            </label>

            <div id="pdfList"></div>

        </div>

    </div>


    <script>

        /* =========================
           TO-DO LIST
        ========================= */

        function createCheckboxRow(taskText) {

            const listContainer =
                document.getElementById('listContainer');

            const emptyMsg =
                document.getElementById('emptyMessage');

            if (emptyMsg) {
                emptyMsg.remove();
            }

            const div = document.createElement('div');

            div.className = 'task-item';

            const leftDiv =
                document.createElement('div');

            leftDiv.className = 'task-left';

            const checkbox =
                document.createElement('input');

            checkbox.type = 'checkbox';

            const label =
                document.createElement('span');

            label.innerText = taskText;

            leftDiv.appendChild(checkbox);
            leftDiv.appendChild(label);

            div.appendChild(leftDiv);

            const deleteBtn =
                document.createElement('button');

            deleteBtn.className = 'delete-btn';

            deleteBtn.innerText = '❌';

            deleteBtn.onclick = function() {

                div.remove();

                if (
                    document.querySelectorAll(
                        '#listContainer .task-item'
                    ).length === 0
                ) {

                    listContainer.innerHTML =
                        '<p id="emptyMessage" style="color: gray; text-align: center; margin-top: 40px;">No remaining tasks. You are at 100%!</p>';

                }

                updateProgress();

            };

            div.appendChild(deleteBtn);

            listContainer.appendChild(div);
        }


        function addManualTask() {

            const inputField =
                document.getElementById('newTaskInput');

            const taskText =
                inputField.value.trim();

            if (taskText === '') {
                return;
            }

            createCheckboxRow(taskText);

            inputField.value = '';

            updateProgress();
        }


        function handleKeyPress(event) {

            if (event.key === 'Enter') {

                addManualTask();

            }

        }


        function loadFile(input) {

            const file = input.files;

            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {

                const text = e.target.result;

                const lines =
                    text.split(/\r?\n/);

                document.getElementById(
                    'listContainer'
                ).innerHTML = '';

                lines.forEach(line => {

                    if (line.trim() !== '') {

                        createCheckboxRow(line);

                    }

                });

                updateProgress();

            };

            reader.readAsText(file);
        }


        function saveFile() {

            const items =
                document.querySelectorAll(
                    '#listContainer .task-item'
                );

            if (items.length === 0) {

                return alert("Nothing to save!");

            }

            let fileContent = "";

            items.forEach(item => {

                fileContent +=
                    item.querySelector('span').innerText
                    + "\n";

            });

            const blob =
                new Blob(
                    [fileContent],
                    { type: 'text/plain' }
                );

            const link =
                document.createElement('a');

            link.href =
                URL.createObjectURL(blob);

            link.download =
                'todo-list.txt';

            link.click();

            URL.revokeObjectURL(link.href);
        }


        function updateProgress() {

            const checkboxes =
                document.querySelectorAll(
                    '#listContainer input[type="checkbox"]'
                );

            const totalItems =
                checkboxes.length;

            let checkedItems = 0;

            checkboxes.forEach(checkbox => {

                if (checkbox.checked) {
                    checkedItems++;
                }

            });

            const percentage =
                totalItems > 0
                    ? Math.round(
                        (checkedItems / totalItems) * 100
                    )
                    : 100;

            document.getElementById(
                'percent'
            ).innerText =
                percentage + "%";

            const wheel =
                document.getElementById(
                    'progressWheel'
                );

            wheel.style.background =
                `conic-gradient(
                    #3345a9 ${percentage}%,
                    #ddd ${percentage}%
                )`;
        }


        /* =========================
           INDEXEDDB
        ========================= */

        let db;

        const request =
            indexedDB.open(
                "ExtraordinaryDatabase",
                1
            );


        request.onupgradeneeded = function(event) {

            db = event.target.result;

            if (!db.objectStoreNames.contains("pdfs")) {

                db.createObjectStore(
                    "pdfs",
                    {
                        keyPath: "id",
                        autoIncrement: true
                    }
                );

            }

        };


        request.onsuccess = function(event) {

            db = event.target.result;

            loadPDFs();

        };


        request.onerror = function() {

            alert("Could not open PDF storage.");

        };


        /* =========================
           UPLOAD PDF
        ========================= */

        function uploadPDF(input) {

            const file =
                input.files[0];

            if (!file) {
                return;
            }

            if (file.type !== "application/pdf") {

                alert("Please upload a PDF file.");

                return;

            }

            const transaction =
                db.transaction(
                    ["pdfs"],
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "pdfs"
                );

            store.add({

                name: file.name,

                file: file,

                date: new Date()

            });

            transaction.oncomplete = function() {

                loadPDFs();

            };

            transaction.onerror = function() {

                alert("Could not save the PDF.");

            };

            input.value = "";

        }


        /* =========================
           LOAD SAVED PDFS
        ========================= */

        function loadPDFs() {

            if (!db) {
                return;
            }

            const pdfList =
                document.getElementById(
                    "pdfList"
                );

            pdfList.innerHTML = "";

            const transaction =
                db.transaction(
                    ["pdfs"],
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    "pdfs"
                );

            const request =
                store.getAll();

            request.onsuccess = function() {

                const pdfs =
                    request.result;

                pdfs.forEach(pdf => {

                    createPDFItem(pdf);

                });

            };

        }


        /* =========================
           CREATE PDF ITEM
        ========================= */

        function createPDFItem(pdf) {

            const pdfList =
                document.getElementById(
                    "pdfList"
                );

            const pdfItem =
                document.createElement(
                    "div"
                );

            pdfItem.className =
                "pdf-item";


            const pdfName =
                document.createElement(
                    "span"
                );

            pdfName.innerText =
                "📄 " + pdf.name;


            const openButton =
                document.createElement(
                    "button"
                );

            openButton.innerText =
                "Open";

            openButton.className =
                "pdf-open";


            openButton.onclick =
                function() {

                    const url =
                        URL.createObjectURL(
                            pdf.file
                        );

                    window.open(
                        url,
                        "_blank"
                    );

                };


            const saveButton =
                document.createElement(
                    "button"
                );

            saveButton.innerText =
                "Save";

            saveButton.className =
                "pdf-save";


            saveButton.onclick =
                function() {

                    const url =
                        URL.createObjectURL(
                            pdf.file
                        );

                    const link =
                        document.createElement(
                            "a"
                        );

                    link.href = url;

                    link.download =
                        pdf.name;

                    link.click();

                    URL.revokeObjectURL(url);

                };


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.innerText =
                "❌";

            deleteButton.className =
                "pdf-delete";


            deleteButton.onclick =
                function() {

                    deletePDF(pdf.id);

                };


            pdfItem.appendChild(
                pdfName
            );

            pdfItem.appendChild(
                openButton
            );

            pdfItem.appendChild(
                saveButton
            );

            pdfItem.appendChild(
                deleteButton
            );


            pdfList.appendChild(
                pdfItem
            );

        }


        /* =========================
           DELETE PDF
        ========================= */

        function deletePDF(id) {

            const transaction =
                db.transaction(
                    ["pdfs"],
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "pdfs"
                );

            store.delete(id);

            transaction.oncomplete =
                function() {

                    loadPDFs();

                };

        }


        /* =========================
           START
        ========================= */

        updateProgress();

    </script>

</body>
</html>
